name: Aktualizovat RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1-5"
    - cron: "15 8 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout obsah repozitáře
        uses: actions/checkout@v4

      - name: Připravit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Nainstalovat knihovny
        run: pip install -r requirements.txt

      - name: Vygenerovat RSS
        run: python generate_rss.py

      - name: Uložit aktualizované RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rss.xml
          git diff --cached --quiet || git commit -m "Aktualizace RSS"
          git push